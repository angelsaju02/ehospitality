<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>patient welcome</title>
    <style>
        body {
            background-image: url({{h}}img/abs.jpg);
            background-size: cover;
            background-repeat: no-repeat;

            background-color: #f4f4f4;
            margin: 0;

        }
        a{
            text-decoration: none;
        }

        }

            position: absolute;
            background-color: #787391;

        }

            text-align: center;
            color: #1f0bb4;
            text-transform: uppercase;
            font-size: 35px;

        }
        button {
            background-color: #ebeef0;
            text-align: center;
            color: white;
            padding: 10px ;
            margin: 10px ;
            margin-top: 15px;
            
        }
        button:hover {
            background-color: #aa0e48;
        }
        nav a:hover {

        }

{% load static %}
{% get_static_prefix as b %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<style>
    body {
    background-image: url({{b}}img/img1.jpg);
    background-size: cover;
    margin: 0; 
    padding: 0; 
    font-family: 'Times New Roman', Times, serif;
}

.container {
    max-width: 800px; 
    margin: 0 auto; 
    text-align: center; 
}

h1 {
    font-style: italic;
    padding: 10px;
    margin-left: 10px;
    color: rgb(3, 4, 49);
    text-shadow: 5px 10px 10px black;
    font-size: 50px;
}

button {
    margin-top: 20px;
    background-color: #082d55;
    color: #fff;
    border: none;
    padding: 10px 20px;
    text-decoration: none;
    font-size: 16px;
    cursor: pointer;
}

button a {
    color: #fff; 
    text-decoration: none;
}

form {
    margin-top: 20px;
}

label {
    /* display: block;  */
    font-size: 20px;
    /* margin-bottom: 1px; */
}



input[type="submit"] {
    background-color: #07967e; 
    color: #fff;
   
}

a {
    text-decoration: none;
    color: #06376b; 
}

a:hover {
    text-decoration: underline; 
}

h3 {
    margin-top: 20px;
    color: #064615; 
}
   
</style>
<body>
    <button><i class="fa-solid fa-backward"></i> <a href="/">Back</a></button>
    <center>
        <form action="" method="post">
            {% csrf_token %}
    <div><br><br>
        <h1>DOCTOR LOGIN</h1><br><br>
            <label>UserName</label> 
            <input type="text"name='uname'><br><br>
            <label>Password</label>
            <input type="password"name='password'><br><br>
            <input type="submit"value='Login'><br><br> 
            <a href="dr_reg">don't have an account sign up here</a>
        </div>
    </form>
    <h3>{{key}}</h3>
    </center>

</body>
</html>

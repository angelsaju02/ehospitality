{% load static %}
{% get_static_prefix as p %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dr_view_appo_for_patient</title>
</head>
<style>
     body {
            background-image: url({{p}}img/ppp.jpg);
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Times New Roman', Times, serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        center {
            margin-top: 20px;
        }

        button {
            background-color: #060741;
            color: #fff;
            padding: 10px 20px;
            border: none;
            text-decoration: none;
            cursor: pointer;
        }

        button a {
            color: #fff;
            text-decoration: none;
        }

        h2{
            margin: 40px;
            font-style: italic;
            color: rgb(18, 23, 95);
            text-shadow: 5px 10px 10px black;
            font-size: 30px;
        }

        table {
            width: 50%;
            margin-top: 20px;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #40336e;
            color: #fff;
        }

        tr:hover {
            background-color: #f5f5f5;
        }
       
</style>
<body>
    
    <button><a href="dr_welcome">Back</a></button>
    <center>
        <h2>REJECT PATIENT APPOINMENTS</h2>
        
        <table border="1">
           
            <tr>
                <th>Patient Name</th>
                <th>Age</th>              
                <th>Phone Number</th>
                <th>Date of Appoinment</th>
            </tr>
            {% for i in app %}
            <tr>
                <td>{{i.patient.user.first_name}}</td> 
                <td>{{i.patient.age}}</td>    
                <td>{{i.patient.phone}}</td>
                <td>{{i.date}}</td>
                
            </tr>
            {% endfor %}
        </table>
        
    </center>
</body>
</html>

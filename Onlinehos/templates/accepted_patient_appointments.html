{% load static %}
{% get_static_prefix as f %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>accepted_appointment</title>
    <style>
        body {
            background-image: url({{f}}img/img55.jpg);
            font-family: 'Times New Roman', Times, serif;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        table {
            width: 50%;
            border-collapse: collapse;
            margin: 20px auto;
        }
        tr:nth-child(even) {
            background-color: #ffffff;
        }

        th, td {
            border: 1px solid #2e2626;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #08444e;
            color: antiquewhite;
        }

        button {
            margin-top: 20px;
        }
        h2{
            margin: 40px;
            font-style: italic;
            color: white;
            text-shadow: 5px 10px 10px black;
            font-size: 30px;
        }
        a{
            text-decoration: none;
        }
</style>
<body>
    
    <button><a href="dr_welcome">Back</a></button>
    <center>
        <h2>ACCEPTED PATIENT APPOINTMENTS</h2>
        
        <table border="1">         
            <tr>
                <th>Patient Name</th>
                <th>Age</th>              
                <th>Phone Number</th>
                <th>Date of Appointment</th>
            </tr>
            {% for i in app %}
            <tr>
                <td>{{i.patient.user.first_name}}</td> 
                <td>{{i.patient.age}}</td>    
                <td>{{i.patient.phone}}</td>
                <td>{{i.date}}</td>
                
            </tr>
            {% endfor %}
        </table>
        
    </center>
</body>
</html>

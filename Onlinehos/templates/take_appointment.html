#DOCTOR UPDATE
{% load static %}
{% get_static_prefix as g %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>doctor update</title>
</head>
<style>
    body {
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', Times, serif;
            background-image: url({{g}}img/imgr.jpg);
            background-size: cover;
            color: #1f1e1e;
        }

        header {
            background-color: #630505;
            padding: 10px;
            text-align: center;
        }

        a {
            text-decoration: none;
        }

        button {
            background-color:white;
            /* color: rgb(15, 14, 14); */
            border: none;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            font-family: 'Times New Roman', Times, serif;
            margin: 10px;
            padding: 5px;

            
        }

        button a {
            color: rgb(22, 22, 22);
        }

        center {
            display: flex;
            justify-content: center;
            align-items: center;
            /* height: 100vh; */
        }

        form {
            background-color: rgba(9, 232, 248, 0.8);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            height: 10%;
            
        }

        h2 {
            text-align: center;
            color: #1c0e2e;
            text-shadow:8px 8px 5px #1c0e2e;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 80%;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
           
        }

        input[type="submit"] {
            background-color: #08686e ;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color:#030447;
        }
    a{
        text-decoration: none;
    }
</style>
<body>
    <button><a href="dr_welcome">Back</a></button>
    <center>       
    <div>
        <form action="" method="post">
            {% csrf_token%}
        <h2>DOCTOR UPDATE</h2><br><br> 
            <label for="">Doctor Name</label>
            <input type="text"name='dname' value='{{doc.dr_user.first_name}}'><br><br>
            <label for="">Age</label>
            <input type="type"name='age'value='{{doc.age}}'><br><br>
            <label for="">Email</label>
            <input type="text"name='email' value='{{doc.dr_user.email}}'><br><br>
            <label for="">Qualification</label>
            <input type="text"name='qualification' value='{{doc.qualification}}'><br><br>
            <label for="">Phone Number</label>
            <input type="number"name='phone' value='{{doc.phone}}'><br><br>
            <input type="submit"value='UPDATE'><br><br>
            
        </form>
    </div>
    
</center>
</body>
</html>

{% load static %}
{% get_static_prefix as e %}
  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>patient register</title>
  </head>
  <style>
    
    body{
          background-image: url({{e}}img/ddd.jpg);
          background-size: cover;
          background-attachment: fixed;
          margin: 0;
          padding: 0;
          font-family: 'Times New Roman', Times, serif;
        }

        a {
            text-decoration: none; 
            color: aliceblue;     
        }

        button {
            background-color: #022a4b; 
            color: white;
            border: none;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px;
        }

        button a {
            color: white;
        }

        center {
            display: flex;
            justify-content: center;
            flex-direction: column;
        }

        form {
            background-color: rgba(2, 29, 36, 0.8); 
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width:300px; 
            /* margin-top: 40px; */
            /* width: 100%; */
        }

        h2 {
            margin-top:0x;
            color: #004261; 
            text-shadow: 3px 8px 5px black;
            font-size: 35px;
            /* margin: 40px; */
        }

        h4 {
            color: #440505; 
        }
        label{
            color: aliceblue;
        }
        input[type="submit"]:hover {
            background-color:#7b7de4;
        }
        input[type="submit"] {
            background-color:#13cedb;
        }
</style>
  <body>
    <button><a href="patient_login">Back</a></button>
    <center>
        
    <h2>PATIENT REGISTRATION</h2>
    <div>
        <form action="" method="post">
            {% csrf_token%}
            <label for="">Patient Name</label>
            <input type="text"name='pname'><br><br>
            <label for="">Pentient ID</label>
            <input type="text"name='pid'><br><br>
            <label for="">Age</label>
            <input type="text"name='age'><br><br>
            <label for="">User Name</label>
            <input type="text"name='uname'><br><br>
            <label for="">Password</label>
            <input type="password"name='password'><br><br>
            <label for="">CPassword</label>
            <input type="password"name='cpassword'><br><br>
            <label for="">Phone Number</label>
            <input type="number"name='phone'><br><br>
            <label for="">Blood Group</label>
            <select name='blg'>
                    <option value="select your blood group">Select your blood group:</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option></select>
                <br><br>
            <input type="submit"value='Register'><br><br>
            <a href="{% url 'patient_login' %}">Already have an account? Login</a>
        </form>
        <h4>{{msg}}</h4>
    </div>
  </center>
  </body>
  </html>
